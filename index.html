<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TS Bot Pro</title>
    
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- External Files (अगर ये नहीं होंगी तो भी कोड क्रैश नहीं होगा) -->
    <script src="core.js"></script>
    <script src="study.js"></script>
    <script src="anime.js"></script>
    <script src="about.js"></script>
    <script src="responses.js"></script>

    <style>
        /* --- Core Styling --- */
        :root { 
            --bg: #131314; --card: #1e1f20; --primary: #8ab4f8; 
            --text: #e3e3e3; --border: #444746; --user-msg: #2b2c2d;
        }
        * { box-sizing: border-box; font-family: 'Google Sans', 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- Auth Screen --- */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .auth-card { text-align: center; width: 90%; max-width: 380px; }
        .auth-card h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--primary); font-weight: 500; }
        .auth-card p { margin-bottom: 25px; color: #9aa0a6; font-size: 14px; }
        .login-btn { width: 100%; padding: 14px; background: white; color: black; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .login-btn:hover { opacity: 0.9; }

        /* --- Sidebars --- */
        #sidebar, #user-sidebar { position: fixed; top: 0; bottom: 0; width: 280px; background: #0b0b0b; z-index: 10001; transition: 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        #sidebar { left: -280px; border-right: 1px solid var(--border); }
        #user-sidebar { right: -280px; border-left: 1px solid var(--border); }
        #sidebar.active { left: 0; }
        #user-sidebar.active { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 10000; display: none; }

        .sidebar-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); color: white; border-radius: 8px; text-align: left; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .sidebar-btn:hover { background: #1e1f20; }

        /* --- Header --- */
        header { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--bg); z-index: 10; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .user-av { width: 36px; height: 36px; background: #3c4043; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--border); font-size: 15px; font-weight: bold; color: var(--primary); overflow: hidden; }

        /* --- Chat Area --- */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 25px; scroll-behavior: smooth; }
        .row { max-width: 800px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .user-msg { align-self: flex-end; background: var(--user-msg); padding: 12px 18px; border-radius: 18px; max-width: 85%; border-bottom-right-radius: 4px; }
        .bot-msg { align-self: flex-start; max-width: 90%; }
        
        /* --- Image Chat Styling --- */
        .chat-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 8px; object-fit: contain; border: 1px solid var(--border); }

        /* --- Typing Indicator Animation --- */
        .typing-indicator { display: inline-flex; align-items: center; gap: 5px; padding: 14px 18px; background: var(--card); border-radius: 18px; border-bottom-left-radius: 4px; max-width: 80px; margin-bottom: 10px; }
        .dot { width: 7px; height: 7px; background: #9aa0a6; border-radius: 50%; animation: blink 1.4s infinite both; }
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.4s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes blink { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }

        /* --- Toolkit Buttons --- */
        .toolkit { display: flex; gap: 15px; margin-top: 8px; }
        .tool-icon { background: none; border: none; color: #9aa0a6; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .tool-icon:hover { color: white; transform: scale(1.1); }

        /* --- Input Bar --- */
        .footer { padding: 10px 15px 20px; max-width: 800px; margin: 0 auto; width: 100%; text-align: center; }
        .input-bar { background: var(--card); border-radius: 30px; padding: 8px 18px; display: flex; align-items: center; gap: 12px; border: 1px solid transparent; }
        .input-bar:focus-within { border-color: var(--border); background: #282a2c; }
        textarea { flex: 1; background: none; border: none; color: white; outline: none; resize: none; font-size: 16px; max-height: 150px; padding: 8px 0; }
        .cat-status { font-size: 11px; color: #9aa0a6; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        /* --- Category Menu --- */
        #cat-menu { position: fixed; bottom: 90px; left: 20px; background: #2d2e30; border: 1px solid var(--border); border-radius: 12px; display: none; flex-direction: column; z-index: 10002; box-shadow: 0 8px 24px rgba(0,0,0,0.5); overflow: hidden; }
        .cat-item { padding: 14px 22px; cursor: pointer; border-bottom: 1px solid #3c4043; font-size: 14px; }
        .cat-item:last-child { border: none; }
        .cat-item:hover { background: #3c4043; color: var(--primary); }

        /* --- Modals (Shared) --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 20000; }
        .modal-content { background: #2d2e30; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
        .modal-textarea { width: 100%; height: 100px; background: #1e1f20; border: 1px solid var(--border); border-radius: 8px; color: white; padding: 10px; outline: none; resize: none; margin-bottom: 15px; margin-top: 10px; }
        .modal-btn { padding: 8px 16px; border-radius: 20px; border: none; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<!-- Setup/Auth Screen -->
<div id="auth-screen">
    <div class="auth-card">
        <h1>TS Bot Pro</h1>
        <p>Apne Google account se surakshit login karein</p>
        <button class="login-btn" onclick="signInWithGoogle()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="22" alt="Google">
            Continue with Google
        </button>
    </div>
</div>

<div id="overlay" onclick="closeAll()"></div>

<!-- User Profile Sidebar -->
<div id="user-sidebar">
    <h3 style="color:var(--primary); margin-bottom:15px;">User Profile</h3>
    <div style="background:#1e1f20; padding:15px; border-radius:10px; font-size:14px; border: 1px solid var(--border);">
        <p><strong>Name:</strong> <span id="p-name">--</span></p>
        <p style="margin-top:8px;"><strong>Email:</strong> <span id="p-email" style="font-size:12px; color:var(--primary);">--</span></p>
        <p style="margin-top:8px;"><strong>Sessions:</strong> <span id="p-chats">0</span></p>
        <div style="display:flex; justify-content:space-around; margin-top:15px; border-top:1px solid var(--border); padding-top:10px; font-size:16px;">
            <span title="Likes Given">👍 <span id="p-likes">0</span></span>
            <span title="Dislikes Given">👎 <span id="p-dislikes">0</span></span>
        </div>
    </div>
    <button class="sidebar-btn" style="margin-top:15px; text-align:center; color:#fff; border-color:#fff; background:#2b2c2d;" onclick="openGeneralFeedback()">📝 Send General Feedback</button>
    <button class="sidebar-btn" style="margin-top:auto; color:#f28b82; border-color:#f28b82;" onclick="logout()">Log Out</button>
</div>

<!-- Chat History Sidebar -->
<div id="sidebar">
    <button class="sidebar-btn" style="border-style:dashed; text-align:center; color:var(--primary); border-color:var(--primary);" onclick="startNewChat()">+ New Chat</button>
    <div id="history-container" style="flex:1; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column; gap:8px;"></div>
    <button class="sidebar-btn" onclick="saveCurrentChat()">💾 Save Current Chat</button>
    <button class="sidebar-btn" onclick="clearAllHistory()" style="color:#f28b82;">🗑️ Clear History</button>
</div>

<!-- Header -->
<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <button class="menu-btn" onclick="toggleSidebar('sidebar')">☰</button>
        <div class="logo">TS Bot <span style="color:var(--primary)">Pro</span></div>
    </div>
    <div class="user-av" onclick="toggleSidebar('user-sidebar')" id="av-char" title="Profile">U</div>
</header>

<!-- Chat Area -->
<div id="chat-box"></div>

<!-- Dislike Feedback Modal -->
<div id="feedback-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color:var(--primary);">Help Bot Improve</h3>
        <textarea id="feedback-text" class="modal-textarea" placeholder="Is jawab mein kya kami thi?"></textarea>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="modal-btn" style="background:transparent; color:#9aa0a6;" onclick="closeFeedback('feedback-modal')">Cancel</button>
            <button class="modal-btn" style="background:var(--primary); color:#000;" onclick="saveDetailedFeedback()">Submit</button>
        </div>
    </div>
</div>

<!-- General App Feedback Modal -->
<div id="general-feedback-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="color:#8ab4f8;">App Feedback</h3>
        <textarea id="general-feedback-text" class="modal-textarea" placeholder="Aapko TS Bot kaisa laga? Koi naya feature chahiye?"></textarea>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button class="modal-btn" style="background:transparent; color:#9aa0a6;" onclick="closeFeedback('general-feedback-modal')">Cancel</button>
            <button class="modal-btn" style="background:#8ab4f8; color:#000;" onclick="submitGeneralFeedback()">Send</button>
        </div>
    </div>
</div>

<!-- Category Menu -->
<div id="cat-menu">
    <div class="cat-item" onclick="selectCat('All', 'Universal Mode')">🌐 All Mode</div>
    <div class="cat-item" onclick="selectCat('Study 📚✏', 'Academic Focus')">📚 Study Mode</div>
    <div class="cat-item" onclick="selectCat('Wikipedia 🌐', 'Encyclopedia API')">📖 Wikipedia</div>
    <div class="cat-item" onclick="selectCat('Google Search 🔍', 'Live Internet')">🔍 Google Search</div>
</div>

<!-- Input Bar (Updated with Image Upload) -->
<div class="footer">
    <div class="input-bar">
        <button class="tool-icon" style="font-size:22px;" onclick="toggleCatMenu()" title="Categories">＋</button>
        <input type="file" id="image-upload" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
        <button class="tool-icon" onclick="document.getElementById('image-upload').click()" title="Upload Image">📎</button>
        <textarea id="main-input" placeholder="Ask TS Bot..." rows="1" oninput="autoResize(this)"></textarea>
        <button class="tool-icon" onclick="startMic()" title="Voice Typing">🎙️</button>
        <button class="tool-icon" style="color:var(--primary); font-size:20px;" onclick="sendMessage()" title="Send">➤</button>
    </div>
    <div class="cat-status" id="status-label">MODE: UNIVERSAL MODE</div>
</div>

<script>
    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
        apiKey: "AIzaSyAHVrybvj-G6OlWDhuk6lMYQkfzL0uo13c",
        authDomain: "ts-bot-24442.firebaseapp.com",
        projectId: "ts-bot-24442",
        storageBucket: "ts-bot-24442.firebasestorage.app",
        messagingSenderId: "31578982286",
        appId: "1:31578982286:web:fb393ee8fde147cf74c6df"
    };

    let db = null;
    let provider = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        provider = new firebase.auth.GoogleAuthProvider();
    } catch (e) {
        console.warn("Firebase initialize nahi ho paya. App offline mode mein chalega.");
    }

    // --- INTERNAL MEMORY FALLBACK ---
    const localDB = {
        "hello": "Namaste! Main TS Bot hoon. Aaj kya janna chahenge?",
        "hi": "Hi there! Main aapka AI assistant hoon.",
        "who are you": "Main TS Bot Pro hoon. Mujhe aapki madad karne ke liye design kiya gaya hai.",
        "kaise ho": "Main bilkul thik hoon, shukriya! Aap kaise hain?",
        "creator": "Mujhe TS Team ne develop kiya hai.",
        "help": "Aap mujhse sawaal pooch sakte hain ya Menu se 'Wikipedia' aur 'Google Search' select kar sakte hain."
    };

    // --- GLOBAL VARIABLES & INIT ---
    let user = JSON.parse(localStorage.getItem('tsUser')) || null;
    let history = JSON.parse(localStorage.getItem('tsHistory')) || [];
    let currentCat = "All";
    let activeMsgIdForFeedback = null;

    if(user) {
        document.getElementById('auth-screen').style.display = 'none';
        if(!user.feedback) user.feedback = { likes: 0, dislikes: 0, logs: [] };
    }

    window.onload = () => { 
        renderHistory(); 
        updateProfileStats(); 
        if(history.length === 0 && user) {
            setTimeout(() => { showTyping(); }, 500);
            setTimeout(() => {
                removeTyping();
                createMsg(`Namaste ${user.name}! Main TS Bot hoon. Aaj aapki kya madad kar sakta hoon?`, "bot"); 
            }, 1500);
        }
    };

    // --- GOOGLE AUTHENTICATION ---
    async function signInWithGoogle() {
        if(!provider) return alert("Firebase configure nahi hai.");
        try {
            const result = await firebase.auth().signInWithPopup(provider);
            const googleUser = result.user;
            user = { 
                name: googleUser.displayName, 
                email: googleUser.email, 
                photo: googleUser.photoURL,
                feedback: { likes: 0, dislikes: 0, logs: [] } 
            };
            localStorage.setItem('tsUser', JSON.stringify(user));
            location.reload();
        } catch (error) {
            alert("⚠️ Login fail ho gaya: " + error.message);
        }
    }

    function logout() { 
        if(firebase.auth) {
            firebase.auth().signOut().then(() => {
                localStorage.removeItem('tsUser'); 
                location.reload(); 
            });
        } else {
            localStorage.removeItem('tsUser'); 
            location.reload();
        }
    }

    // --- UI CONTROLS ---
    function toggleSidebar(id) {
        closeAll();
        document.getElementById(id).classList.add('active');
        document.getElementById('overlay').style.display = 'block';
        updateProfileStats();
    }
    function closeAll() {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('user-sidebar').classList.remove('active');
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('cat-menu').style.display = 'none';
    }
    function toggleCatMenu() {
        const m = document.getElementById('cat-menu');
        m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
    }
    function selectCat(name, label) {
        currentCat = name;
        document.getElementById('status-label').innerText = `MODE: ${label}`;
        closeAll();
        showToast(`${name} mode activated!`);
    }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

    // --- PROFILE STATS (With Profile Picture) ---
    function updateProfileStats() {
        if(!user) return;
        document.getElementById('p-name').innerText = user.name;
        document.getElementById('p-email').innerText = user.email;
        document.getElementById('p-chats').innerText = history.length;
        document.getElementById('p-likes').innerText = user.feedback ? user.feedback.likes : 0;
        document.getElementById('p-dislikes').innerText = user.feedback ? user.feedback.dislikes : 0;
        
        const av = document.getElementById('av-char');
        if (user.photo) {
            av.innerHTML = `<img src="${user.photo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        } else {
            av.innerText = user.name[0].toUpperCase();
        }
    }

    // --- TYPING EFFECT ---
    function showTyping() {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        div.className = `row bot-msg`;
        div.id = 'typing-indicator-row';
        div.innerHTML = `
            <div class="typing-indicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
    function removeTyping() {
        const typingEl = document.getElementById('typing-indicator-row');
        if (typingEl) typingEl.remove();
    }

    // --- WIKIPEDIA API (Conversational) ---
    async function fetchFromWiki(query) {
        try {
            const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
            if(res.status === 404) return `Maaf karna, mujhe <b>"${query}"</b> ke baare mein Wikipedia par kuch nahi mila.`;
            const data = await res.json();
            
            if (data.type === 'standard' || data.type === 'disambiguation') {
                return `Mujhe Wikipedia se iske baare mein yeh jankari mili hai:<br><br>
                <b>${data.title}</b><br>${data.extract}<br><br>
                <a href="${data.content_urls.desktop.page}" target="_blank" style="color:var(--primary); font-size:14px; text-decoration:none;">🔗 Poora article padhne ke liye yahan click karein</a>`;
            }
            return "Maaf karna, main iski poori jankari nahi dhoond paya.";
        } catch (error) {
            return "⚠️ Internet mein kuch dikkat hai. Main Wikipedia se connect nahi kar paa raha hoon.";
        }
    }

    // --- MAIN CHAT ENGINE ---
    async function sendMessage() {
        const input = document.getElementById('main-input');
        const text = input.value.trim();
        if(!text) return;

        if (text === "tsadmin123") {
            showToast("Accessing Admin Panel...");
            setTimeout(() => { window.location.href = "admin.html"; }, 1500);
            return;
        }

        createMsg(text, 'user');
        input.value = "";
        input.style.height = 'auto';

        showTyping(); // Start Typing Animation

        setTimeout(async () => {
            let response = "";
            const query = text.toLowerCase();
            
            const externalDB = { ...(window.vedaCore || {}), ...(window.vedaStudy || {}), ...(window.anime || {}), ...localDB };

            if (currentCat === 'Wikipedia 🌐') {
                response = await fetchFromWiki(text);
            } 
            else if (currentCat === 'Google Search 🔍') {
                response = `Main ek direct AI hoon aur Google search ke results padh nahi sakta, par maine aapke liye ek link tayar kiya hai. Aap yahan click karke apna jawab dekh sakte hain:<br><br>
                <a href="https://www.google.com/search?q=${encodeURIComponent(text)}" target="_blank" style="background:var(--primary); color:#000; padding:8px 16px; border-radius:20px; text-decoration:none; display:inline-block; font-weight:bold; margin-top:5px;">🌍 Google Par Search Karein</a>`;
            }
            else if (externalDB[query]) {
                response = externalDB[query];
            } 
            else {
                response = `Mujhe apni memory mein iska exact match nahi mila. Kya main aapke liye isse online dhoondh doon?<br><br>
                <button class="sidebar-btn" style="width:auto; border-color:var(--primary); color:var(--primary); padding:6px 12px; margin-top:10px;" onclick="triggerAutoSearch('Wiki', '${text.replace(/'/g, "\\'")}')">📖 Wikipedia</button>
                <button class="sidebar-btn" style="width:auto; border-color:var(--primary); color:var(--primary); padding:6px 12px; margin-left:8px; margin-top:10px;" onclick="triggerAutoSearch('Google', '${text.replace(/'/g, "\\'")}')">🔍 Google</button>`;
            }

            removeTyping(); // Stop Typing Animation
            createMsg(response, 'bot');
            saveMessageToCloud(text, response);
        }, 1200);
    }

    function triggerAutoSearch(type, text) {
        document.getElementById('main-input').value = text;
        if(type === 'Wiki') selectCat('Wikipedia 🌐', 'Encyclopedia API');
        else selectCat('Google Search 🔍', 'Live Internet');
        sendMessage();
    }

    // --- MESSAGE UI & CLOUD ---
    function createMsg(text, sender) {
        const box = document.getElementById('chat-box');
        const div = document.createElement('div');
        const msgId = "msg-" + Date.now() + Math.random().toString(36).substr(2,5);
        
        div.className = `row ${sender}-msg msg-row`;
        div.id = msgId;
        
        let html = `<div class="msg-content" style="font-size:16px; line-height:1.5;">${text}</div>`;
        
        if(sender === 'bot') {
            html += `
                <div class="toolkit">
                    <button class="tool-icon" onclick="speakText('${msgId}')" title="Listen">🔊</button>
                    <button class="tool-icon" onclick="copyText('${msgId}')" title="Copy">📋</button>
                    <button class="tool-icon like-btn" onclick="handleFeedback('${msgId}', 'like')" title="Good">👍</button>
                    <button class="tool-icon dislike-btn" onclick="handleFeedback('${msgId}', 'dislike')" title="Bad">👎</button>
                </div>`;
        }
        
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function saveMessageToCloud(uText, bText) {
        if(!user || !user.email || !db) return; 
        try {
            await db.collection("chats").add({
                user_email: user.email,
                user_name: user.name,
                user: uText,
                bot: bText,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        } catch (error) { console.error("Cloud Error:", error); }
    }

    // --- IMAGE UPLOAD SYSTEM ---
    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { showToast("5MB se choti image upload karein!"); return; }

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Image = e.target.result;
            const imgHtml = `<img src="${base64Image}" class="chat-img" alt="Uploaded Image">`;
            createMsg(imgHtml, 'user');
            event.target.value = '';

            showTyping();
            setTimeout(() => {
                removeTyping();
                const botReply = "Main abhi is image ko theek se dekh ya samajh nahi sakta, par aap mujhe text mein bata sakte hain ki isme kya hai! 😅";
                createMsg(botReply, 'bot');
                saveMessageToCloud("[User Sent an Image]", botReply);
            }, 1500);
        };
        reader.readAsDataURL(file);
    }

    // --- WORKING TOOLS (Mic, Copy, Speak) ---
    function speakText(id) {
        window.speechSynthesis.cancel();
        const text = document.getElementById(id).querySelector('.msg-content').innerText;
        const s = new SpeechSynthesisUtterance(text);
        s.lang = 'hi-IN';
        window.speechSynthesis.speak(s);
    }
    function copyText(id) {
        const text = document.getElementById(id).querySelector('.msg-content').innerText;
        navigator.clipboard.writeText(text);
        showToast("Text Copied!");
    }
    function startMic() {
        const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!Rec) return alert("Voice typing is not supported in this browser.");
        const r = new Rec(); 
        r.lang = 'hi-IN';
        showToast("Listening... Speak now 🎙️");
        r.onresult = (e) => { 
            document.getElementById('main-input').value = e.results[0][0].transcript; 
            sendMessage(); 
        };
        r.start();
    }

    // --- FEEDBACK SYSTEMS ---
    function openGeneralFeedback() {
        closeAll();
        document.getElementById('general-feedback-modal').style.display = 'flex';
    }
    function submitGeneralFeedback() {
        const text = document.getElementById('general-feedback-text').value.trim();
        if(!text) return alert("Kripya apna feedback likhein.");
        if (!user.feedback) user.feedback = { likes: 0, dislikes: 0, logs: [] };
        user.feedback.logs.push({ type: "General Feedback", issue: text, date: new Date().toLocaleString() });
        saveUser();
        closeFeedback('general-feedback-modal');
        showToast("Feedback ke liye dhanyawad! 🌟");
    }
    function handleFeedback(msgId, type) {
        const msgEl = document.getElementById(msgId);
        if (!user.feedback) user.feedback = { likes: 0, dislikes: 0, logs: [] };

        if (type === 'like') {
            msgEl.querySelector('.like-btn').style.color = "var(--primary)";
            msgEl.querySelector('.dislike-btn').style.color = "#9aa0a6";
            user.feedback.likes++;
            saveUser();
            showToast("Thanks! Bot is learning. 😊");
        } else {
            activeMsgIdForFeedback = msgId;
            document.getElementById('feedback-modal').style.display = 'flex';
        }
    }
    function closeFeedback(modalId) {
        document.getElementById(modalId).style.display = 'none';
        if(modalId === 'feedback-modal') document.getElementById('feedback-text').value = "";
        if(modalId === 'general-feedback-modal') document.getElementById('general-feedback-text').value = "";
    }
    function saveDetailedFeedback() {
        const text = document.getElementById('feedback-text').value.trim();
        if(!text) return alert("Please specify the issue.");

        const msgEl = document.getElementById(activeMsgIdForFeedback);
        let query = "Unknown Query";
        let prevEl = msgEl.previousElementSibling;
        while(prevEl) {
            if(prevEl.classList.contains('user-msg')) {
                query = prevEl.querySelector('.msg-content').innerText;
                break;
            }
            prevEl = prevEl.previousElementSibling;
        }

        if (!user.feedback) user.feedback = { likes: 0, dislikes: 0, logs: [] };
        user.feedback.dislikes++;
        user.feedback.logs.push({ type: "Message Dislike", query: query, issue: text, date: new Date().toLocaleString() });
        
        msgEl.querySelector('.dislike-btn').style.color = "#f28b82";
        msgEl.querySelector('.like-btn').style.color = "#9aa0a6";

        saveUser();
        closeFeedback('feedback-modal');
        showToast("Feedback submitted. 🛠️");
    }
    function saveUser() {
        localStorage.setItem('tsUser', JSON.stringify(user));
        updateProfileStats();
    }

    // --- HISTORY SYSTEM ---
    function saveCurrentChat() {
        const content = document.getElementById('chat-box').innerHTML;
        if(!content || content.trim() === "") return;
        const firstUserMsg = document.querySelector('.user-msg .msg-content');
        const title = firstUserMsg ? firstUserMsg.innerText.substring(0, 20) : "Conversation";
        history.unshift({ id: Date.now(), title: title + "...", data: content });
        localStorage.setItem('tsHistory', JSON.stringify(history));
        renderHistory();
        showToast("Chat Saved! 💾");
    }
    function renderHistory() {
        const cont = document.getElementById('history-container');
        if(!cont) return;
        cont.innerHTML = history.map(h => `<button class="sidebar-btn" onclick="loadChat(${h.id})">${h.title}</button>`).join('');
    }
    function loadChat(id) {
        const item = history.find(h => h.id == id);
        if(item) { document.getElementById('chat-box').innerHTML = item.data; closeAll(); }
    }
    function clearAllHistory() {
        if(confirm("Are you sure you want to clear all history?")) { 
            localStorage.removeItem('tsHistory'); history = []; renderHistory(); startNewChat(); 
        }
    }
    function startNewChat() { 
        document.getElementById('chat-box').innerHTML = ""; closeAll(); 
        createMsg(`Mai aapki help Kaise karun?`, "bot"); 
    }

    // --- HELPER ---
    function showToast(msg) {
        const oldToast = document.getElementById('ts-toast');
        if(oldToast) oldToast.remove();
        const toast = document.createElement('div');
        toast.id = 'ts-toast';
        toast.style = "position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#3c4043; color:white; padding:8px 16px; border-radius:20px; font-size:13px; z-index:10005;";
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => { if(toast) toast.remove(); }, 2500);
    }
</script>

</body>
</html>
